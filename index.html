<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#003876" />
    <meta name="description" content="AzTU LMS Portal — Tutor &amp; Admin platform of Azerbaijan Technical University." />
    <title>AzTU Portal</title>
  </head>
  <body class="dark:bg-gray-900">
    <script>
      // Apply the persisted theme before first paint. Without this the class is
      // only set once React mounts, so a dark-mode session flashes a white page.
      (function () {
        try {
          var raw = localStorage.getItem("aztu.ui.theme") ||
                    sessionStorage.getItem("aztu.ui.theme");
          var mode = raw ? JSON.parse(raw) : "system";
          if (mode === "dark" || (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) { /* storage blocked — fall back to light */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
