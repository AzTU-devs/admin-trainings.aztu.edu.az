server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Don't advertise the exact nginx version.
    server_tokens off;

    # ── gzip ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml font/woff2;

    # ── security headers ──────────────────────────────────────────────
    # NOTE: any location below that adds its own header must re-include this,
    # because add_header does not inherit into a block that sets its own.
    include /etc/nginx/snippets/security-headers.conf;

    # ── health check ──────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ── hashed static assets: cache hard ──────────────────────────────
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA history fallback ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # never cache the shell
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
