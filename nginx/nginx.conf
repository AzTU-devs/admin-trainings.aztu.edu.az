server {
    # 8081, not 80, because the production compose file uses host networking:
    # there is no port mapping to translate 80 to 8081, so nginx must bind the
    # published port itself. Host networking is what lets UFW actually govern
    # this port — Docker's published-port rules are evaluated ahead of UFW's
    # INPUT chain and would bypass it.
    listen       8081;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Don't advertise the exact nginx version.
    server_tokens off;

    # ── gzip ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml font/woff2;

    # ── security headers ──────────────────────────────────────────────
    # NOTE: any location below that adds its own header must re-include this,
    # because add_header does not inherit into a block that sets its own.
    include /etc/nginx/snippets/security-headers.conf;

    # ── health check ──────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ── hashed static assets: cache hard ──────────────────────────────
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API proxy ─────────────────────────────────────────────────────
    # The SPA is built with VITE_API_BASE_URL=/api, so every call is
    # same-origin and lands here. Without this block they fall through to the
    # history fallback below, which tries to serve index.html — and a static
    # file cannot answer a POST, so login returns 405, not a useful error.
    #
    # Same-origin also means no CORS: the backend does not need this host in
    # CORS_ALLOWED_ORIGINS.
    #
    # UPSTREAM: the backend runs with network_mode: host on this same machine,
    # so it is reachable on loopback. Change the port here if the API's
    # SERVER_PORT is not the default 8080. A literal address is used on purpose
    # — a variable in proxy_pass forces runtime DNS and needs a resolver.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Lesson video uploads run in 5 MB chunks (VITE_UPLOAD_CHUNK_SIZE_MB);
        # nginx defaults to 1 MB and would reject them with 413.
        client_max_body_size 64m;

        # Uploads and report queries outlast the 60s default.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Responses here are JSON for the app, never documents — the SPA's
        # security headers do not apply.
        proxy_buffering off;
    }

    # ── SPA history fallback ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # never cache the shell
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
