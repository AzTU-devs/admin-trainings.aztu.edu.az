# This file is copied to /etc/nginx/conf.d/default.conf, which the stock
# nginx.conf globs into the `http` context — so the two `map` blocks below are
# legal here, and they have to live outside `server {}`.

# Upgrade support, switched per request. A blanket `Connection: upgrade` on every
# proxied call (what this config used to send) is wrong for the REST traffic that
# makes up all of /api/: it advertises a protocol switch that never happens and
# breaks upstream keepalive. Only the WebSocket handshake carries an Upgrade
# request header, and only then does this evaluate to `upgrade`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Prefer an X-Forwarded-Proto from an upstream TLS terminator over $scheme.
# nginx here only ever speaks plain HTTP on 8081 (see the listen note), so
# forwarding $scheme unconditionally tells the backend "http" even when the
# browser used https — and server.forward-headers-strategy=framework makes the
# backend believe it, which then leaks into secure-cookie and absolute-URL
# decisions. With no terminator in front, $scheme is still the right answer.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    # 8081, not 80, because the production compose file uses host networking:
    # there is no port mapping to translate 80 to 8081, so nginx must bind the
    # published port itself. Host networking is what lets UFW actually govern
    # this port — Docker's published-port rules are evaluated ahead of UFW's
    # INPUT chain and would bypass it.
    listen       8081;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Don't advertise the exact nginx version.
    server_tokens off;

    # ── real client IP ────────────────────────────────────────────────
    # Trust an X-Forwarded-For only from a proxy on loopback — i.e. a TLS
    # terminator running on this same host (see DEPLOY.md; nothing in this repo
    # terminates TLS). $remote_addr then becomes the real client address.
    #
    # This matters beyond logging: without it the /api/ block would forward
    # $proxy_add_x_forwarded_for, which APPENDS to whatever the client sent — so
    # anyone could send `X-Forwarded-For: 1.2.3.4` and put a spoofed address
    # FIRST in the list the backend reads. That list is exactly what the API's
    # rate limiter and IP blocklist key on, so the spoof would defeat both.
    #
    # If TLS is terminated on a DIFFERENT machine, add that machine's address
    # here, or every request will look like it comes from the load balancer and
    # the backend will rate-limit all users as one client.
    set_real_ip_from  127.0.0.1;
    set_real_ip_from  ::1;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ── gzip ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml font/woff2;

    # ── security headers ──────────────────────────────────────────────
    # NOTE: any location below that adds its own header must re-include this,
    # because add_header does not inherit into a block that sets its own.
    # Conversely, a location that sets NO header of its own inherits these — so
    # every location either includes a header snippet deliberately or is
    # commented to say which policy it inherits and why that is the right one.
    include /etc/nginx/snippets/security-headers.conf;

    # ── health check ──────────────────────────────────────────────────
    # default_type rather than `add_header Content-Type`: add_header would append
    # a SECOND Content-Type next to the inherited default (octet-stream) and
    # would discard every inherited security header into the bargain.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # ── hashed static assets: cache hard ──────────────────────────────
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API proxy ─────────────────────────────────────────────────────
    # The SPA is built with VITE_API_BASE_URL=/api, so every call is
    # same-origin and lands here. Without this block they fall through to the
    # history fallback below, which tries to serve index.html — and a static
    # file cannot answer a POST, so login returns 405, not a useful error.
    #
    # Same-origin also means no CORS: the backend does not need this host in
    # CORS_ALLOWED_ORIGINS for REST. The /ws handshake below is the exception.
    #
    # UPSTREAM: the backend runs with network_mode: host on this same machine,
    # so it is reachable on loopback. Change the port here if the API's
    # SERVER_PORT is not the default 8080. A literal address is used on purpose
    # — a variable in proxy_pass forces runtime DNS and needs a resolver.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # A single, clean value — see the set_real_ip_from note above for why
        # this is not $proxy_add_x_forwarded_for.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # No WebSocket lives under /api/ (the STOMP endpoint is /ws, its own
        # location), but routing the header through the map keeps a future
        # upgrade here working without re-breaking REST keepalive.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Lesson videos are uploaded as ONE request — `PUT /api/videos/{id}/content`
        # with xhr.send(file), no chunking — so this ceiling has to clear the
        # largest single file the backend accepts. It must stay ABOVE
        # UPLOAD_MAX_VIDEO_MB (512) in the API's env and VITE_UPLOAD_MAX_VIDEO_MB
        # (512) in .env.production; the ~38 MB of headroom covers multipart
        # framing and headers. Set it below 512 and a legitimate upload dies with
        # an opaque 413 that never reaches the backend's own error handling.
        client_max_body_size 550m;

        # client_body_timeout is the gap allowed BETWEEN reads of the request
        # body, not a total budget — a 512 MB upload on a 2 Mbit/s link takes
        # ~35 minutes and no timeout here bounds it as long as bytes keep
        # arriving. 300s (up from the 60s default) is tolerance for a mobile
        # connection that stalls mid-upload rather than a limit on slow ones.
        client_body_timeout 300s;

        # Stream the request body to the backend instead of spooling it. With the
        # default (buffering on) nginx writes the whole 512 MB into client_temp
        # before the backend sees byte one: two disk writes per upload, and an
        # unauthenticated client could fill the container's disk with bodies the
        # backend would have rejected with 401. Off, the backend's auth and size
        # checks run while the bytes are still arriving.
        proxy_request_buffering off;
        # Responses stream too, so video range requests and file downloads start
        # immediately instead of after nginx has buffered the whole body.
        proxy_buffering off;

        proxy_connect_timeout 10s;
        # Per-gap, like client_body_timeout — neither is a total budget, which is
        # why 600s is enough for an upload that takes ~35 minutes on a 2 Mbit/s
        # link. proxy_send_timeout is armed while the body is still being
        # forwarded and is reset on every write to the backend, and with request
        # buffering off nginx writes as fast as the client's bytes arrive; so the
        # 600s is spent only if the backend stops accepting data for ten straight
        # minutes, by which point client_body_timeout has usually fired first.
        # Raising them would not help a slow uploader, only hold wedged
        # connections open longer. proxy_read_timeout additionally has to outlast
        # the slowest report queries, which is why it is not the 60s default.
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # Headers, explicitly. The trap is that add_header DOES inherit into a
        # location declaring none of its own — so without this include /api/
        # silently serves the app-shell CSP set at server level for the SPA,
        # which is both wrong for a JSON/file endpoint and far too permissive for
        # one. The include picks the policy on purpose instead: nothing allowed,
        # sandboxed, so a file served from this same-origin path can never act as
        # a document. See api-headers.conf for why that is safe for XHR, uploads
        # and media loads.
        include /etc/nginx/snippets/api-headers.conf;
    }

    # ── STOMP-over-WebSocket ──────────────────────────────────────────
    # The SPA derives this URL from VITE_API_BASE_URL by stripping the trailing
    # /api — so with the same-origin default it connects to wss://<this host>/ws,
    # and the backend's endpoint is at the server root, NOT under /api. Without
    # this block the handshake falls through to the history fallback, gets
    # index.html back, and live notifications fail silently (the client swallows
    # WebSocket errors and retries forever).
    #
    # The handshake IS origin-checked by the backend even though it is
    # same-origin here, because Spring validates the browser's Origin header
    # against CORS_ALLOWED_ORIGINS — so this host must be listed there. See
    # DEPLOY.md.
    #
    # Headers: this location deliberately adds none, so it inherits the SPA set
    # from the server level. Headers on a 101 Switching Protocols response are
    # meaningless to a WebSocket client either way; what matters is that nothing
    # here weakens the document policy.
    location /ws {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # A notification socket is idle for long stretches. The client heartbeats
        # every 10s, so 1h only has to outlast a heartbeat gap, not the session;
        # the default 60s would still be enough, but being explicit stops a
        # future heartbeat change from silently dropping connections.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SPA history fallback ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # never cache the shell
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
