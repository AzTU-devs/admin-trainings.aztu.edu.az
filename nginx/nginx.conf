server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── gzip ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml font/woff2;

    # ── security headers ──────────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"                 always;
    add_header X-Content-Type-Options     "nosniff"                    always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    # Tighten CSP to match your API/CDN origins in production.
    add_header Content-Security-Policy    "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http: https:; script-src 'self'; frame-ancestors 'self'" always;

    # ── health check ──────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ── hashed static assets: cache hard ──────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA history fallback ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # never cache the shell
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
