# Response headers that every location serves, CSP deliberately excluded.
#
# The SPA shell and the proxied API need *different* content policies — an app
# shell has to be allowed to run its own scripts, a JSON/file API must be allowed
# nothing at all — so the CSP lives in the two files that include this one:
#   security-headers.conf  → SPA shell + hashed assets
#   api-headers.conf       → the /api/ proxy
#
# These are in an include rather than written once at server level because
# nginx's add_header does NOT merge across levels: a `location` containing ANY
# add_header discards every add_header inherited from `server`.

# DENY rather than SAMEORIGIN: the SPA contains no <iframe> at all, so there is
# no same-origin framing case left to allow.
add_header X-Frame-Options        "DENY"                            always;
add_header X-Content-Type-Options "nosniff"                         always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

# payment=() because the product has no payment provider (the backend runs with
# app.payments.enabled=false); the rest are capabilities an admin console has no
# use for, and a compromised dependency should not be able to reach them.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# The portal never opens a window it then talks to (no window.open anywhere in
# the SPA), so severing cross-origin window references costs nothing here and
# removes the handle that XS-Leaks are built on.
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Nothing served here is public: the SPA is a staff console behind a login and the
# /api/ responses proxied through it are per-user data. A crawler that reaches
# either still indexes the URL it saw and any error body it got, so say no
# explicitly rather than relying on the login to look uninteresting.
add_header X-Robots-Tag "noindex, nofollow" always;
