# Security headers for the proxied /api/ location.
#
# Why /api/ needs its own policy: the proxy makes the backend same-origin, so
# https://admin-trainings.aztu.edu.az/api/media/{id}/content is a portal URL. The
# backend is the first line of defence there — it rejects script-bearing upload
# types, sends X-Content-Type-Options and a Content-Disposition, and never stores
# an executable content type. This file is the second: if a file that is HTML,
# SVG or anything else script-bearing ever does get served from here and a
# browser navigates to it as a document, that document gets no origin, no
# scripts, no forms and no network.
include /etc/nginx/snippets/security-headers-common.conf;

# `sandbox` is what makes this airtight: the document is dropped into an opaque
# origin, so even if it somehow ran it could not read the portal's session or
# call the API as the logged-in admin. default-src 'none' is belt and braces on
# top of that. allow-downloads is the one capability kept, so that opening a
# media URL directly still produces the Content-Disposition: attachment download
# instead of a silently blocked one.
#
# This costs the SPA nothing: a CSP header on an XHR/fetch/<img>/<video> response
# is ignored by the browser — CSP applies to documents and workers — so every
# API call, upload and media load behaves exactly as before.
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox allow-downloads" always;

# The API exists for this origin's own app. No other site should be able to pull
# bytes out of it, and CORP is the header that says so even for loads (<img>,
# <script>, <video>) that CORS does not gate.
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Exactly one copy of the two headers whose DUPLICATE form fails open. The
# backend sets security headers of its own (Spring Security's defaults, plus the
# upload hardening) and add_header APPENDS rather than replaces, so anything set
# on both sides reaches the browser twice. For X-Frame-Options, nosniff and CSP
# that is harmless or fails closed — browsers take the first nosniff value, deny
# on a conflicting frame policy, and enforce the intersection of every CSP
# present — so those duplicates are deliberately left alone. CORP and COOP are
# the exception: `same-origin, same-origin` parses as neither a known value nor
# an absent header, and browsers resolve that by ignoring it, which is the one
# case where doubling a header REMOVES a protection. Hide the upstream's copy so
# the value above is authoritative either way.
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;

# Nothing else the backend sends is hidden. Content-Disposition, Content-Type and
# the backend's own nosniff are the FIRST line of defence on
# /api/media/{id}/content and must reach the browser untouched; this file is only
# the second.
