# Security headers, kept in one file because nginx's add_header does NOT merge
# across levels: a `location` block containing ANY add_header discards every
# add_header inherited from `server`. So each location that sets its own header
# must `include` this file to keep the rest.
#
# Tighten connect-src / img-src to your real API + CDN origins before go-live.
add_header X-Frame-Options         "SAMEORIGIN"                                always;
add_header X-Content-Type-Options  "nosniff"                                   always;
add_header Referrer-Policy         "strict-origin-when-cross-origin"           always;
add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()"  always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http: https: ws: wss:; script-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
