# Security headers for everything nginx serves itself: the SPA shell and its
# hashed assets. The proxied API gets api-headers.conf instead.
#
# Kept in one file because nginx's add_header does NOT merge across levels: a
# `location` block containing ANY add_header discards every add_header inherited
# from `server`. So each location that sets a header of its own must `include`
# this file (or api-headers.conf) to keep the rest.
include /etc/nginx/snippets/security-headers-common.conf;

# CSP for the SPA. Every source below is one the built bundle actually needs,
# checked against dist/ rather than guessed:
#
#   script-src  'self' plus ONE inline hash. index.html carries a small inline
#               script that applies the persisted theme before first paint, and
#               Vite copies it into dist/index.html verbatim — so 'self' on its
#               own silently blocks it and every dark-mode session flashes white.
#               The hash covers the script's exact text; if that script is ever
#               edited, recompute it with:
#                 printf '%s' "<script body>" | openssl dgst -sha256 -binary | openssl base64
#               A stale hash is not fatal — it only brings the white flash back.
#   style-src   'unsafe-inline' is unavoidable: Tailwind and the Radix primitives
#               set element styles inline. fonts.googleapis.com is the @import at
#               the top of src/index.css (the Outfit family).
#   font-src    fonts.gstatic.com is where that stylesheet points for the files.
#   img-src     'self' for /api-proxied images, data: for inlined SVG icons,
#               blob: for the object URLs MediaImage and ImageUploader build, and
#               the API origin for when the portal calls the API directly (below).
#   media-src   'self' for <video src="/api/videos/{id}/content">, blob: for the
#               local preview in VideoUploader, and the API origin, same reason.
#   connect-src Narrowed from `http: https: ws: wss:` (no restriction at all) to
#               exactly the two ways this portal can reach the API:
#
#                 same-origin   VITE_API_BASE_URL=/api — the committed default.
#                               REST and the STOMP socket both go to this host;
#                               'self' covers them, and CSP3 lets 'self' match a
#                               ws(s) URL on the same host and port.
#                 cross-origin  VITE_API_BASE_URL=https://api-trainings.aztu.edu.az/api
#                               — required whenever the portal runs under the
#                               bridged docker-compose.yml rather than the
#                               host-networked prod file, because there this
#                               container's own /api proxy reaches its own loopback,
#                               not the host's API on :8080.
#
#               resolveWsUrl() in useNotificationStream.ts derives the socket from
#               the same base, so it follows: wss://<this host>/ws in the first
#               case, wss://api-trainings.aztu.edu.az/ws in the second.
#
#               The hostnames are literal because this file is baked into the
#               image at build time and nginx cannot read the build args here.
#               They name THIS deployment's real hosts — the portal is served at
#               dashboard-trainings.aztu.edu.az, not admin-trainings (that is only
#               the repo's name). If either host changes, change it here too: the
#               failure is silent, because the STOMP client swallows the CSP
#               violation and retries forever, and a blocked REST call looks like
#               a network error. Check the browser console for a CSP violation
#               before suspecting the API or the proxy.
#   frame-src / object-src / frame-ancestors  'none': the SPA embeds nothing and
#               is embedded nowhere.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-WckbBPD9qWb3jEYDy4x26r90NRxARyGz/GU0VpxSA7I='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://api-trainings.aztu.edu.az; media-src 'self' blob: https://api-trainings.aztu.edu.az; connect-src 'self' https://api-trainings.aztu.edu.az wss://api-trainings.aztu.edu.az wss://dashboard-trainings.aztu.edu.az; frame-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
