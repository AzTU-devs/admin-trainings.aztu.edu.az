# Security headers for everything nginx serves itself: the SPA shell and its
# hashed assets. The proxied API gets api-headers.conf instead.
#
# Kept in one file because nginx's add_header does NOT merge across levels: a
# `location` block containing ANY add_header discards every add_header inherited
# from `server`. So each location that sets a header of its own must `include`
# this file (or api-headers.conf) to keep the rest.
include /etc/nginx/snippets/security-headers-common.conf;

# CSP for the SPA. Every source below is one the built bundle actually needs,
# checked against dist/ rather than guessed:
#
#   script-src  'self' plus ONE inline hash. index.html carries a small inline
#               script that applies the persisted theme before first paint, and
#               Vite copies it into dist/index.html verbatim — so 'self' on its
#               own silently blocks it and every dark-mode session flashes white.
#               The hash covers the script's exact text; if that script is ever
#               edited, recompute it with:
#                 printf '%s' "<script body>" | openssl dgst -sha256 -binary | openssl base64
#               A stale hash is not fatal — it only brings the white flash back.
#   style-src   'unsafe-inline' is unavoidable: Tailwind and the Radix primitives
#               set element styles inline. fonts.googleapis.com is the @import at
#               the top of src/index.css (the Outfit family).
#   font-src    fonts.gstatic.com is where that stylesheet points for the files.
#   img-src     'self' for /api-proxied images, data: for inlined SVG icons,
#               blob: for the object URLs MediaImage and ImageUploader build.
#   media-src   'self' for <video src="/api/videos/{id}/content">, blob: for the
#               local preview in VideoUploader.
#   connect-src 'self' is the whole allowance now (it was `http: https: ws: wss:`,
#               i.e. no restriction at all). It covers the REST calls, which are
#               same-origin because the production build uses
#               VITE_API_BASE_URL=/api, and it covers the STOMP socket:
#               resolveWsUrl() in useNotificationStream.ts turns that same base
#               into ws(s)://<this host>/ws, and CSP3 lets 'self' match a ws(s)
#               URL whose host AND port match the document's — which includes the
#               plain ws:// this origin gets while it is still served over HTTP
#               (see DEPLOY.md, "TLS / reverse proxy"). The literal wss origin is
#               belt and braces for browsers that never implemented that rule;
#               carrying no port it only ever matches 443, so it does nothing when
#               the portal is reached directly on :8081, and it must be replaced
#               if the portal moves to another hostname. 'self' alone is enough on
#               anything current — if notifications go quiet after a hostname
#               change, look for a CSP violation in the console before suspecting
#               the /ws proxy, because the STOMP client swallows the error and
#               retries forever.
#   frame-src / object-src / frame-ancestors  'none': the SPA embeds nothing and
#               is embedded nowhere.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-WckbBPD9qWb3jEYDy4x26r90NRxARyGz/GU0VpxSA7I='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://admin-trainings.aztu.edu.az; frame-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
